spring.application.name=lease-reconciliation

# ---- In-memory H2 database (no install needed) ----
spring.datasource.url=jdbc:h2:mem:reconciliation;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Browse the DB at http://localhost:8080/h2-console
# (JDBC URL: jdbc:h2:mem:reconciliation  user: sa  password: <blank>)
spring.h2.console.enabled=true

# ---- AI mode toggle ----
# mock = built-in heuristic simulation, runs with no API key (DEFAULT)
# real = call an actual LLM via Spring AI (see README "Switching on the real AI")
recon.ai.mode=mock

# =====================================================================
# REAL AI - fill these in ONLY after you uncomment the Spring AI
# dependency in pom.xml and set recon.ai.mode=real.
# The exact property names depend on the provider you generate from
# start.spring.io. Example for the OpenAI-compatible starter:
# =====================================================================
# spring.ai.openai.api-key=${OPENAI_API_KEY}
# spring.ai.openai.chat.options.model=gpt-4o-mini
# spring.ai.openai.chat.options.temperature=0.0
